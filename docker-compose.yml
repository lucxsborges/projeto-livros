
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projeto_livros_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - livros_network

  nginx:
    image: nginx:stable-alpine
    container_name: projeto_livros_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - livros_network

  db:
    image: mysql:8.0
    container_name: projeto_livros_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: projeto_livros
      MYSQL_USER: livros_user
      MYSQL_PASSWORD: livros_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - livros_network

networks:
  livros_network:
    driver: bridge

volumes:
  mysql_data:
